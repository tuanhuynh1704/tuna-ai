[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuna-ai"
version = "0.1.0"
description = "Nghiên cứu và xây dựng mô hình ngôn ngữ lớn song ngữ từ đầu (Bilingual LLM from Scratch)"
authors = [
    { name = "Tuna AI Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
]
filterwarnings = [
    "ignore::pytest.PytestRemovedIn10Warning",
    "ignore::DeprecationWarning",
]
